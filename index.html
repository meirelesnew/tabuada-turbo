<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabuada Turbo ⚡ | Jogo de Tabuada Online Grátis</title>
  <meta name="description" content="Aprenda a tabuada de multiplicar de forma divertida! Jogue grátis: timer, ranking, níveis clássico e aleatório. Sem login!">
  <meta name="keywords" content="tabuada, tabuada online, jogo de tabuada, multiplicação, matemática">
  <meta name="theme-color" content="#ff6b35">
  <link rel="canonical" href="https://tabuadaturbo.com.br/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0e17;--card:#1a1830;--accent:#ff6b35;--accent2:#ffd700;--green:#39ff14;--red:#ff3366;--text:#fffffe;--muted:#a7a9be;--radius:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh}
    .screen{display:none;padding:20px;max-width:480px;margin:0 auto;min-height:100vh}
    .screen.active{display:block}
    .logo{font-family:'Boogaloo',cursive;font-size:3rem;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .tagline{text-align:center;color:var(--muted);margin-bottom:20px}
    .card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    .input{width:100%;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--text);font-size:1.1rem;padding:12px;outline:none}
    .input:focus{border-color:var(--accent)}
    .btn{width:100%;padding:16px;border-radius:var(--radius);border:none;font-family:'Boogaloo',cursive;font-size:1.3rem;cursor:pointer;background:linear-gradient(135deg,var(--accent),#ff8c55);color:#fff;margin-top:10px}
    .btn-level{background:var(--card);border:2px solid rgba(255,255,255,0.08);color:var(--text);font-family:'Boogaloo',cursive;font-size:1.2rem;padding:20px;border-radius:var(--radius);width:100%;margin-bottom:12px;cursor:pointer;text-align:left}
    .btn-level:hover{border-color:var(--accent)}
    .player-bar{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px}
    .player-avatar{font-size:1.5rem}
    .player-name{font-weight:700}
    .timer{font-family:'Boogaloo',cursive;font-size:2.5rem;color:var(--accent2);text-align:center;margin:10px 0}
    .stats{display:flex;gap:10px;margin-bottom:14px}
    .stat{flex:1;background:var(--card);border-radius:10px;padding:10px;text-align:center}
    .stat .v{font-family:'Boogaloo',cursive;font-size:1.3rem}
    .stat .l{font-size:0.7rem;color:var(--muted)}
    .stat.green .v{color:var(--green)}
    .stat.red .v{color:var(--red)}
    .question{text-align:center;background:rgba(255,107,53,0.1);border:2px solid var(--accent);border-radius:var(--radius);padding:15px;margin-bottom:10px;font-family:'Boogaloo',cursive;font-size:1.8rem}
    .resposta{font-family:'Boogaloo',cursive;font-size:2rem;background:rgba(255,255,255,0.07);border:2px solid var(--accent);border-radius:10px;padding:10px;text-align:center;min-width:80px}
    .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
    .nk{background:var(--card);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--text);font-family:'Boogaloo',cursive;font-size:1.5rem;padding:15px;cursor:pointer;text-align:center}
    .nk:active{background:var(--accent)}
    .nk.ok{background:var(--accent);grid-column:span 2}
    table{border-collapse:collapse;width:100%;margin:10px 0}
    th,td{width:40px;height:40px;text-align:center;border:1px solid rgba(255,255,255,0.2)}
    th{background:var(--card);color:var(--accent2);font-family:'Boogaloo',cursive}
    td.answered-correct{background:rgba(57,255,20,0.2);color:var(--green)}
    td.answered-wrong{background:rgba(255,51,102,0.2);color:var(--red)}
    td.active-cell{outline:3px solid var(--accent);background:rgba(255,107,53,0.2)}
    .rank-item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px}
    .rank-pos{font-family:'Boogaloo',cursive;font-size:1.2rem;min-width:30px}
    .rank-pos.gold{color:var(--accent2)}
    .rank-time{font-family:'Boogaloo',cursive;color:var(--accent2)}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:10px;padding:12px 24px;display:none;z-index:999}
    .toast.show{display:block}
    .toast.err{border-color:var(--red);color:var(--red)}
    .toast.ok{border-color:var(--green);color:var(--green)}
    @media(max-width:360px){th,td{width:32px;height:32px;font-size:0.8rem}}
  </style>
</head>
<body>
<div id="screen-loading" class="screen active">
  <div class="logo">TABUADA<br>TURBO ⚡</div>
  <p style="text-align:center;margin-top:40px;font-family:'Boogaloo',cursive;font-size:1.5rem;color:var(--accent2)">Conectando...</p>
</div>

<div id="screen-cadastro" class="screen">
  <div class="logo">TABUADA<br>TURBO ⚡</div>
  <p class="tagline">Quem é o mais rápido?</p>
  <div class="card">
    <label class="field-label">Seu apelido</label>
    <input type="text" id="inp-nome" class="input" placeholder="Ex: Lucas" maxlength="20">
  </div>
  <button class="btn" onclick="irParaMenu()">JOGAR ▶</button>
  <button class="btn-level" style="margin-top:10px;background:transparent;border:2px solid rgba(255,255,255,0.2)" onclick="irParaRanking()">🏆 Ver Ranking</button>
</div>

<div id="screen-menu" class="screen">
  <div id="player-bar" class="player-bar"></div>
  <div class="card" style="text-align:center">
    <div style="font-size:0.8rem;color:var(--muted)">SEU MELHOR TEMPO</div>
    <div id="high-score" style="font-family:'Boogaloo',cursive;font-size:1.5rem;color:var(--accent2)">⏱️ Sem recorde</div>
  </div>
  <p style="font-family:'Boogaloo',cursive;font-size:1.4rem;text-align:center;margin:10px 0">Escolha o Nível</p>
  <button class="btn-level" onclick="iniciarJogo(1)">📊 Nível 1 — Clássico</button>
  <button class="btn-level" onclick="iniciarJogo(2)">🎲 Nível 2 — Embaralhado</button>
  <button class="btn-level" style="background:transparent;border:2px solid rgba(255,255,255,0.2)" onclick="irParaRanking()">🏆 Ranking</button>
  <button class="btn-level" style="background:transparent;border:2px solid rgba(255,255,255,0.2)" onclick="mostrarTela('screen-cadastro')">🔄 Trocar jogador</button>
</div>

<div id="screen-jogo" class="screen">
  <div id="player-bar-jogo" class="player-bar"></div>
  <div class="timer" id="timer">00:00</div>
  <div class="stats">
    <div class="stat green"><div class="v" id="acertos">0</div><div class="l">✅ Acertos</div></div>
    <div class="stat red"><div class="v" id="erros">0</div><div class="l">❌ Erros</div></div>
    <div class="stat"><div class="v" id="restam">100</div><div class="l">⬜ Restam</div></div>
  </div>
  <div class="question" id="question">2 × 3 = ?</div>
  <div style="display:flex;justify-content:center;gap:10px;align-items:center">
    <div class="resposta" id="resposta">?</div>
  </div>
  <div class="numpad">
    <div class="nk" onclick="numpad('1')">1</div><div class="nk" onclick="numpad('2')">2</div><div class="nk" onclick="numpad('3')">3</div>
    <div class="nk" onclick="numpad('4')">4</div><div class="nk" onclick="numpad('5')">5</div><div class="nk" onclick="numpad('6')">6</div>
    <div class="nk" onclick="numpad('7')">7</div><div class="nk" onclick="numpad('8')">8</div><div class="nk" onclick="numpad('9')">9</div>
    <div class="nk" onclick="numpad('del')">⌫</div><div class="nk" onclick="numpad('0')">0</div><div class="nk ok" onclick="numpad('ok')">OK</div>
  </div>
  <div style="overflow-x:auto"><table id="tabela"></table></div>
  <button class="btn-level" style="background:transparent;border:2px solid rgba(255,255,255,0.2)" onclick="desistir()">↩ Desistir</button>
</div>

<div id="screen-resultado" class="screen" style="text-align:center;padding-top:40px">
  <div style="font-size:4rem" id="trofeu">🏆</div>
  <div class="timer" id="tempo-fim" style="font-size:3rem">00:00</div>
  <p style="color:var(--muted)">TEMPO TOTAL</p>
  <div id="acertos-fim" style="margin:20px 0;font-size:1.2rem"></div>
  <button class="btn" onclick="iniciarJogo(nivelAtual)">🔁 Jogar de novo</button>
  <button class="btn-level" style="margin-top:10px;background:transparent;border:2px solid rgba(255,255,255,0.2)" onclick="irParaRanking()">🏆 Ver Ranking</button>
  <button class="btn-level" style="background:transparent;border:2px solid rgba(255,255,255,0.2)" onclick="mostrarTela('screen-menu')">◀ Menu</button>
</div>

<div id="screen-ranking" class="screen">
  <p class="logo" style="font-size:2rem">🏆 Ranking</p>
  <div style="display:flex;gap:5px;margin-bottom:15px">
    <button class="btn-level" style="flex:1;padding:10px;font-size:0.9rem" onclick="switchTab(1)">Nível 1</button>
    <button class="btn-level" style="flex:1;padding:10px;font-size:0.9rem" onclick="switchTab(2)">Nível 2</button>
  </div>
  <div id="rank-list"></div>
  <button class="btn-level" style="background:transparent;border:2px solid rgba(255,255,255,0.2)" onclick="mostrarTela('screen-menu')">◀ Menu</button>
</div>

<div id="toast" class="toast"></div>

<script>
const API_URL = 'https://tabuada-turbo.onrender.com';
let jogador = { nome: '', avatar: '🦁' };
let nivel = 1, nivelAtual = 1, jogoAtivo = false;
let celulas = [], celulaAtiva = 0, acertos = 0, erros = 0, segundos = 0, timerInterval = null;
let respostaAtual = '', axisX = [], axisY = [];

document.addEventListener('DOMContentLoaded', () => {
  const salvo = localStorage.getItem('tt_jogador');
  if (salvo) try { jogador = JSON.parse(salvo); } catch(e) {}
  checkApiHealth();
  setInterval(() => fetch(API_URL + '/ping', { mode: 'no-cors' }).catch(()=>{}), 25000);
  document.addEventListener('keydown', e => {
    if (!jogoAtivo) return;
    if (e.key >= '0' && e.key <= '9') numpad(e.key);
    else if (e.key === 'Backspace') numpad('del');
    else if (e.key === 'Enter') numpad('ok');
  });
});

async function checkApiHealth() {
  try {
    const res = await fetch(API_URL + '/health');
    if (res.ok) {
      if (jogador.nome) irParaMenu();
      else mostrarTela('screen-cadastro');
      return;
    }
  } catch(e) {}
  mostrarTela('screen-cadastro');
}

function mostrarTela(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function irParaMenu() {
  const nome = document.getElementById('inp-nome')?.value.trim();
  if (!nome) { toast('Digite seu apelido!', 'err'); return; }
  jogador.nome = nome;
  localStorage.setItem('tt_jogador', JSON.stringify(jogador));
  
  document.getElementById('player-bar').innerHTML = `<div class="player-avatar">${jogador.avatar}</div><div class="player-name">${jogador.nome}</div>`;
  
  const r1 = localStorage.getItem('tt_recorde_1') || 0;
  const r2 = localStorage.getItem('tt_recorde_2') || 0;
  const melhor = Math.min(r1, r2);
  document.getElementById('high-score').textContent = melhor ? `⏱️ ${formatar(melhor)}` : '⏱️ Sem recorde';
  
  fetch(API_URL + '/jogador/salvar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome: jogador.nome, avatar: jogador.avatar })
  }).catch(()=>{});
  
  mostrarTela('screen-menu');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function iniciarJogo(n) {
  nivel = nivelAtual = n;
  jogoAtivo = true;
  acertos = erros = segundos = 0;
  respostaAtual = '';
  celulaAtiva = 0;
  
  axisX = [...Array(10)].map((_,i) => i + 1);
  axisY = [...Array(10)].map((_,i) => i + 1);
  if (n === 2) { axisX = shuffle(axisX); axisY = shuffle(axisY); }
  
  celulas = [];
  axisX.forEach(x => axisY.forEach(y => celulas.push({ x, y, correto: null })));
  celulas[0].correto = null;
  
  document.getElementById('player-bar-jogo').innerHTML = `<div class="player-avatar">${jogador.avatar}</div><div class="player-name">${jogador.nome}</div>`;
  atualizarStats();
  renderTabela();
  mostrarCelula();
  iniciarTimer();
  mostrarTela('screen-jogo');
}

function iniciarTimer() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('timer').textContent = '00:00';
  timerInterval = setInterval(() => {
    segundos++;
    document.getElementById('timer').textContent = formatar(segundos);
  }, 1000);
}

function atualizarStats() {
  document.getElementById('acertos').textContent = acertos;
  document.getElementById('erros').textContent = erros;
  document.getElementById('restam').textContent = celulas.length - (acertos + erros);
}

function formatar(s) {
  return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
}

function renderTabela() {
  let html = '<tr><th>×</th>';
  axisX.forEach(x => html += `<th>${x}</th>`);
  html += '</tr>';
  axisY.forEach((y, yi) => {
    html += `<tr><th>${y}</th>`;
    axisX.forEach((x, xi) => {
      const idx = yi * axisX.length + xi;
      const c = celulas[idx];
      let cls = '';
      if (c.correto === true) cls = 'answered-correct';
      else if (c.correto === false) cls = 'answered-wrong';
      else if (idx === celulaAtiva) cls = 'active-cell';
      html += `<td class="${cls}" onclick="tocar(${idx})">${x*y}</td>`;
    });
    html += '</tr>';
  });
  document.getElementById('tabela').innerHTML = html;
}

function tocar(idx) {
  if (!jogoAtivo) return;
  celulaAtiva = idx;
  celulas[idx].correto = null;
  respostaAtual = '';
  document.getElementById('resposta').textContent = '?';
  renderTabela();
  mostrarCelula();
}

function mostrarCelula() {
  const c = celulas[celulaAtiva];
  document.getElementById('question').innerHTML = `<span style="color:var(--accent)">${c.x}</span> × <span style="color:var(--accent)">${c.y}</span> = ?`;
}

function numpad(t) {
  if (!jogoAtivo) return;
  if (t === 'del') respostaAtual = respostaAtual.slice(0, -1);
  else if (t === 'ok') verificar();
  else if (respostaAtual.length < 3) respostaAtual += t;
  document.getElementById('resposta').textContent = respostaAtual || '?';
}

function verificar() {
  if (!respostaAtual || celulaAtiva === null) return;
  const correta = celulas[celulaAtiva].x * celulas[celulaAtiva].y;
  const acertou = parseInt(respostaAtual) === correta;
  celulas[celulaAtiva].correto = acertou;
  
  if (acertou) { acertos++; toast('✅ Correto!', 'ok'); }
  else { erros++; toast(`❌ Era ${correta}`, 'err'); }
  
  respostaAtual = '';
  document.getElementById('resposta').textContent = '?';
  atualizarStats();
  renderTabela();
  
  if (acertou) celulaAtiva++;
  if (celulaAtiva >= celulas.length) finalizar();
  else { celulas[celulaAtiva].correto = null; renderTabela(); mostrarCelula(); }
}

function finalizar() {
  jogoAtivo = false;
  clearInterval(timerInterval);
  
  const key = 'tt_recorde_' + nivel;
  const atual = parseInt(localStorage.getItem(key) || '0');
  if (!atual || segundos < atual) localStorage.setItem(key, segundos);
  
  fetch(API_URL + '/ranking/salvar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome: jogador.nome, avatar: jogador.avatar, nivel, tempo: segundos, acertos, erros, modo: 'solo' })
  }).catch(()=>{});
  
  document.getElementById('tempo-fim').textContent = formatar(segundos);
  document.getElementById('acertos-fim').innerHTML = `✅ <strong>${acertos}</strong> acertos | ❌ <strong>${erros}</strong> erros`;
  document.getElementById('trofeu').textContent = acertos >= 90 ? '🏆' : (acertos >= 70 ? '🥈' : '🥉');
  mostrarTela('screen-resultado');
}

function desistir() {
  if (confirm('Desistir?')) {
    jogoAtivo = false;
    clearInterval(timerInterval);
    mostrarTela('screen-menu');
  }
}

async function switchTab(n) {
  const list = document.getElementById('rank-list');
  list.innerHTML = '<p style="text-align:center;color:var(--muted)">Carregando...</p>';
  try {
    const res = await fetch(API_URL + '/ranking/global?nivel=' + n);
    const data = await res.json();
    if (data.ranking && data.ranking.length) {
      let html = '';
      data.ranking.forEach((r, i) => {
        html += `<div class="rank-item"><div class="rank-pos ${i<3?'gold':''}">${i+1}º</div><div>${r.avatar||'🦁'}</div><div style="flex:1"><div>${r.nome}</div><div style="font-size:0.7rem;color:var(--muted)">${r.modo||'solo'}</div></div><div class="rank-time">${formatar(r.tempo)}</div></div>`;
      });
      list.innerHTML = html;
    } else {
      list.innerHTML = '<p style="text-align:center;color:var(--muted)">Nenhum registro ainda</p>';
    }
  } catch(e) {
    list.innerHTML = '<p style="text-align:center;color:var(--muted)">Ranking indisponível</p>';
  }
}

function irParaRanking() { switchTab(1); mostrarTela('screen-ranking'); }

function toast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + tipo;
  setTimeout(() => el.className = 'toast', 2000);
}
</script>
</body>
</html>
