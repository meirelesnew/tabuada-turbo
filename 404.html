<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página não encontrada — Tabuada Turbo ⚡</title>
<style>
  *{{box-sizing:border-box;margin:0;padding:0}}
  body{{background:#0f0e17;color:#fffffe;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}}
  .emoji{{font-size:5rem;margin-bottom:16px;animation:pulse 2s ease-in-out infinite}}
  @keyframes pulse{{0%,100%{{transform:scale(1)}}50%{{transform:scale(1.08)}}}}
  h1{{font-size:3rem;color:#ffd700;margin-bottom:8px}}
  p{{color:#a7a9be;font-size:1rem;margin-bottom:32px;max-width:320px;line-height:1.6}}
  a{{display:inline-block;background:linear-gradient(135deg,#ff6b35,#ff8c55);color:#fff;text-decoration:none;padding:16px 32px;border-radius:12px;font-size:1.1rem;font-weight:700;margin:6px;transition:transform .2s}}
  a:hover{{transform:translateY(-2px)}}
  a.sec{{background:transparent;border:2px solid rgba(255,255,255,0.2);color:#a7a9be}}
</style>
</head>
<body>
  <div class="emoji">🤔</div>
  <h1>404</h1>
  <p>Essa página não existe, mas a tabuada sim! Que tal voltar ao jogo?</p>
  <a href="/">🎮 Voltar ao jogo</a>
  <a href="/#ranking" class="sec">🏆 Ver ranking</a>
</body>
</html>
